<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#090c12">
<title>Chapter 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#090c12; --bg1:#121924; --ink:#aeb8c6; --ink-soft:#7d8898; --wax:#3a3f48;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg0);overflow:hidden}
  body{
    min-height:100dvh;color:var(--ink);
    font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    background:radial-gradient(120% 80% at 50% 38%,var(--bg1) 0%,var(--bg0) 70%);
    -webkit-font-smoothing:antialiased;
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(90% 70% at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%)}
  main{
    position:relative;z-index:1;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-right) + 28px)
            calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 28px);
    text-align:center;
  }
  p{
    font-style:italic;font-weight:300;
    font-size:clamp(23px,6.4vw,38px);line-height:1.45;letter-spacing:.01em;
    max-width:17em;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;
  }
  p span{display:block;opacity:0;filter:blur(6px);transform:translateY(8px);
    animation:appear 3.2s cubic-bezier(.2,.6,.2,1) forwards}
  p span:nth-child(1){animation-delay:1.2s}
  p span:nth-child(2){animation-delay:3.6s}
  p span:nth-child(3){animation-delay:6.4s;color:var(--ink-soft);margin-top:.9em}
  @keyframes appear{to{opacity:1;filter:blur(0);transform:none}}

  .candle{margin-top:46px;width:44px;height:120px;opacity:0;animation:fadein 4s ease 8.6s forwards}
  @keyframes fadein{to{opacity:.85}}
  .smoke path{fill:none;stroke:#8b95a3;stroke-linecap:round;stroke-width:1.4;opacity:0;
    filter:url(#soft);transform-box:fill-box;transform-origin:50% 100%;
    animation:rise 6s ease-out infinite}
  .smoke path:nth-child(2){animation-delay:2s}
  .smoke path:nth-child(3){animation-delay:4s}
  @keyframes rise{
    0%{opacity:0;transform:translateY(6px) scaleY(.6)}
    20%{opacity:.5}
    100%{opacity:0;transform:translateY(-18px) translateX(4px) scaleY(1.15)}
  }
  @media (prefers-reduced-motion:reduce){
    p span,.candle{animation:none;opacity:1;filter:none;transform:none}
    .candle{opacity:.85}
    .smoke path{animation:none;opacity:.3}
  }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<main>
  <p>
    <span>Our story ended in Chapter 1,</span>
    <span>but even so, it was the best chapter.</span>
    <span>Thank you for these moments.</span>
  </p>
  <svg class="candle" viewBox="0 0 44 120" aria-hidden="true">
    <defs>
      <filter id="soft" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur stdDeviation=".8"/></filter>
      <linearGradient id="wax" x1="0" x2="1">
        <stop offset="0" stop-color="#2b3038"/><stop offset=".45" stop-color="#4a505a"/><stop offset="1" stop-color="#262a31"/>
      </linearGradient>
    </defs>
    <g class="smoke">
      <path d="M22 60 C 18 50, 27 44, 22 34 S 17 18, 23 6"/>
      <path d="M22 60 C 26 52, 17 45, 22 36 S 27 22, 20 10"/>
      <path d="M22 60 C 19 53, 25 47, 21 40 S 18 28, 24 16"/>
    </g>
    <line x1="22" y1="70" x2="22" y2="61" stroke="#15171b" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M12 72 Q22 67 32 72 L32 114 L12 114 Z" fill="url(#wax)"/>
    <path d="M14 73 q1 9 -1 13 q-1 3 1 2 q2-1 1-15z" fill="#4c525c" opacity=".7"/>
    <path d="M28 73 q1 5 0 7 q-1 2 1 1 q1-1 0-8z" fill="#4c525c" opacity=".6"/>
    <ellipse cx="22" cy="115" rx="17" ry="3" fill="#1b1f26"/>
  </svg>
</main>
<script>
(() => {
  const c = document.getElementById('rain');
  const g = c.getContext && c.getContext('2d');
  if (!g || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let W, H, dpr, drops = [];
  function size(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(W * H / 5200);
    drops = Array.from({length:n}, () => drop(true));
  }
  function drop(any){
    const z = Math.random();
    return {x:Math.random()*W*1.2 - W*.1, y:any ? Math.random()*H : -40,
            l:10 + z*22, v:1.4 + z*3.2, a:.04 + z*.12, w:.5 + z*.7};
  }
  function frame(){
    g.clearRect(0, 0, W, H);
    g.lineCap = 'round';
    for (const d of drops){
      d.y += d.v; d.x -= d.v * .12;
      if (d.y > H + 40) Object.assign(d, drop(false));
      g.strokeStyle = `rgba(150,165,185,${d.a})`;
      g.lineWidth = d.w;
      g.beginPath(); g.moveTo(d.x, d.y); g.lineTo(d.x + d.l * .12, d.y - d.l); g.stroke();
    }
    requestAnimationFrame(frame);
  }
  addEventListener('resize', size);
  size(); frame();
})();
</script>
</body>
</html>
